packages:
  - apps/*
  - packages/*

catalog:
  "@xterm/headless": 6.0.0
  "@xterm/addon-serialize": 0.14.0
  "@xterm/addon-webgl": 0.19.0
  "@xterm/xterm": 6.0.0
  node-pty: 1.1.0
  zod: 4.6.5
  playwright: 1.63.0

nodeLinker: isolated
saveExact: true
engineStrict: true
strictPeerDependencies: true
allowBuilds:
  electron@45.0.0: true
  # better-sqlite3 13 ships N-API prebuilds inside its tarball. Its implicit node-gyp build never
  # runs, so every install loads the published prebuild (scripts/native-prepare.mjs checks this).
  better-sqlite3@13.0.3: false
  node-pty@1.1.0: true
strictDepBuilds: true
verifyDepsBeforeRun: error
minimumReleaseAgeExclude:
  - "@vitest/mocker@5.0.2"
  - "@vitest/spy@5.0.2"
  - vite@8.3.1
  - vitest@5.0.2
patchedDependencies:
  node-pty@1.1.0: patches/node-pty@1.1.0.patch
  thread-stream@4.2.0: patches/thread-stream@4.2.0.patch
