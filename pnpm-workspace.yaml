packages:
  - apps/*
  - packages/*

catalog:
  "@xterm/headless": 6.0.0
  "@xterm/addon-serialize": 0.14.0
  "@xterm/xterm": 6.0.0
  node-pty: 1.1.0
  zod: 4.6.5
  playwright: 1.63.0

nodeLinker: isolated
saveExact: true
engineStrict: true
strictPeerDependencies: true
allowBuilds:
  node-pty@1.1.0: true
strictDepBuilds: true
verifyDepsBeforeRun: error
minimumReleaseAgeExclude:
  - "@vitest/mocker@5.0.2"
  - "@vitest/spy@5.0.2"
  - vite@8.3.1
  - vitest@5.0.2
patchedDependencies:
  node-pty@1.1.0: patches/node-pty@1.1.0.patch
