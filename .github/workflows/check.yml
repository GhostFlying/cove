name: Engineering checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: "Manual diagnostic mode (leave empty for full checks)"
        required: false
        type: string
      expected_sha:
        description: "Exact diagnostic source SHA"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}-${{ inputs.diagnostic || 'full' }}
  cancel-in-progress: ${{ inputs.diagnostic != 'browser-close-v1-l4' }}

jobs:
  check:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.diagnostic == '' && inputs.expected_sha == '') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # At least checkJobMinimumMs (89 minutes) from ciTimeBudget in ci-environment-setup.mjs. The
    # bounds nest: the Vitest run (40 minutes) < the `pnpm check` stage that runs the gate (52)
    # < this job. While unbounded work stays within its reserves, each step's own bound then fires
    # and records evidence before the job is cancelled. A tooling test fails if this drops below
    # the budget.
    timeout-minutes: 90
    env:
      # m2 S1/S2 install a runtime closure and register a real user service (a LaunchAgent, a
      # systemd user unit) named after their temporary data directory; the runners have both
      # managers (verified for M2 T3). See apps/cli/tests/m2/s1-install-fixture.mjs.
      COVE_TEST_SERVICE_MANAGER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # The runtime closure (scripts/runtime-closure.mjs) builds cove-tsnet.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/tailscale/go.mod
          cache-dependency-path: native/tailscale/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      # Linux: linger keeps the runner's systemd user manager independent of a login session (D2),
      # and systemctl --user finds it through XDG_RUNTIME_DIR.
      - name: Prepare the systemd user manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          runtime="/run/user/$(id -u)"
          for _ in $(seq 1 50); do [ -S "$runtime/systemd/private" ] && break; sleep 0.2; done
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$runtime" systemctl --user show-environment > /dev/null
      - run: node scripts/ci-environment-setup.mjs --init
      - run: node scripts/ci-environment-setup.mjs --install
      - run: node scripts/ci-test-gate.mjs --environment
      - run: node scripts/ci-environment-setup.mjs --native
      - run: node scripts/ci-environment-setup.mjs --browser
      - run: node scripts/ci-environment-setup.mjs --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ci-${{ github.sha }}-${{ github.job }}-${{ matrix.os }}-${{ runner.arch }}
          path: .cache/ci/
          if-no-files-found: error
          retention-days: 14

  # cove-tsnet (native/tailscale) builds with Go, not pnpm, so it is a separate job with its own
  # small bound instead of a share of the check job's budget.
  tsnet:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.diagnostic == '' && inputs.expected_sha == '') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/tailscale/go.mod
          cache-dependency-path: native/tailscale/go.sum
      - run: node scripts/tsnet-build.mjs test -count=1
      - run: node scripts/tsnet-build.mjs build --goarch arm64
      - run: node scripts/tsnet-build.mjs build --goarch amd64

  browser-close-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic == 'browser-close-v1-l4' }}
    name: browser-close diagnostic (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      COVE_DIAGNOSTIC_MODE: ${{ inputs.diagnostic }}
      COVE_DIAGNOSTIC_EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: node scripts/ci-test-gate.mjs --diagnostic-identity
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: node scripts/ci-environment-setup.mjs --init
      - run: node scripts/ci-environment-setup.mjs --install
      - run: node scripts/ci-environment-setup.mjs --native
      - run: node scripts/ci-environment-setup.mjs --browser
      - run: pnpm build
      - run: node scripts/ci-test-gate.mjs --browser-close-diagnostic
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-close-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/ci/browser-close-diagnostic/
            .cache/ci/browser-cleanup/
            .cache/ci/environment.json
            .cache/ci/setup/
          if-no-files-found: error
          retention-days: 14

  invalid-diagnostic-input:
    if: ${{ github.event_name == 'workflow_dispatch' && ((inputs.diagnostic != '' && inputs.diagnostic != 'browser-close-v1-l4') || (inputs.diagnostic == '' && inputs.expected_sha != '')) }}
    name: invalid diagnostic input
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
